server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 30m;
  server_tokens off;   # não mostra a versão do nginx

  # Cabeçalhos de segurança
  # CSP: só scripts do próprio sistema; fontes do Google Fonts; nada de abrir o sistema dentro de outro site.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # O endereço da API é consultado de novo no DNS do Docker a cada 10 s.
  # Sem isso, recriar só a API (docker compose up -d --force-recreate api) deixava o nginx
  # apontando para o endereço antigo e todas as chamadas davam 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_destino http://api:3001;

  location /api/ {
    proxy_pass $api_destino;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
